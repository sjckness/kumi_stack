services:
  kumi:
    image: kumi:dev
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.novnc
    ports:
      - "6080:6080"
      - "8765:8765"
    environment:
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: "0"
      COLCON_HOME: /workspaces/kumi_stack/.colcon
      PYTHONUNBUFFERED: "1"
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    volumes:
      - ..:/workspaces/kumi_stack:cached
      - kumi_build:/workspaces/kumi_stack/build
      - kumi_install:/workspaces/kumi_stack/install
      - kumi_log:/workspaces/kumi_stack/log
    command: /novnc-entrypoint.sh

volumes:
  kumi_build:
  kumi_install:
  kumi_log:
